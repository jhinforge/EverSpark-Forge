name: Media access regression
on:
  push:
    branches:
      - "refactor/distributed-architecture"
      - "codex/media-access-*"
    paths:
      - "Aegis/Storage/**"
      - "Archon/**"
      - "Legate/**"
      - "Tests/**"
      - ".github/workflows/media-access.yml"
  pull_request:
    paths:
      - "Aegis/Storage/**"
      - "Archon/**"
      - "Legate/**"
      - "Tests/**"
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Python syntax
        run: python -m compileall -q Aegis Archon Legate Tests
      - name: Infrastructure and binary media
        run: python -m unittest discover -s Tests/Infrastructure -p 'test_*.py'
      - name: Archon and distributed creation
        run: python -m unittest discover -s Tests/Archon -p 'test_*.py'
      - name: WebUI
        run: python -m unittest discover -s Tests/WebUI -p 'test_*.py'
      - name: JavaScript UI regression
        run: node --test Tests/WebUI/*.js
      - name: Verify pinned LibreSpeed installer
        run: |
          python - <<'PYTEST'
          import tempfile, subprocess
          from pathlib import Path
          from Legate.Envoy.bandwidth import install
          with tempfile.TemporaryDirectory() as directory:
              binary = install(Path(directory))
              version = subprocess.check_output([str(binary), '--version'], text=True)
              assert '1.0.14' in version, version
              print(version)
          PYTEST

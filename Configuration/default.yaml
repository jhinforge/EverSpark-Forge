application:
  name: EverSpark Forge
  environment: local

runtime:
  data_directory: ./Data
  log_directory: ./Data/Logs
  output_directory: ./Data/Outputs

storage:
  backend: local
  local:
    root_directory: ./Data
  rclone:
    enabled: false
    config_file: null
    image_remote: null
    concept_remote: null

network:
  backend: local
  local:
    host: 127.0.0.1
  cloudflare:
    enabled: false
    tunnel_uuid: null
    tunnel_name: null
    hostname: null
    credential_source: null

services:
  webui:
    host: 127.0.0.1
    port: 8780
  orchestrator:
    host: 127.0.0.1
    port: 8765
  concept_forge:
    provider: ollama
    base_url: http://127.0.0.1:11434
  image_forge:
    adapter: comfyui
    base_url: http://127.0.0.1:8188

memory:
  working:
    enabled: true
    max_turns: 12
  episodic:
    enabled: true
  state:
    enabled: true

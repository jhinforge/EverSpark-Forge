application:
  name: EverSpark Forge
  environment: local

runtime:
  data_directory: ./Data
  log_directory: ./Data/Logs
  output_directory: ./Data/Outputs
  managed:
    comfyui_version: v0.37.0
    comfyui_commit: 73c9bad4d21e7addbe1d13bc92eee0f1431b017d
    ollama_version: 0.34.2
    torch_index_url: https://download.pytorch.org/whl/cu130
    single_gpu_ollama_keep_alive: 0
  gpu_assignment:
    image_forge: 0
    concept_forge: 1

storage:
  backend: local
  local:
    root_directory: ./Data
  rclone:
    enabled: false
    config_file: null
    image_remote: null
    concept_remote: null

network:
  backend: local
  local:
    host: 127.0.0.1
  cloudflare:
    enabled: false
    tunnel_uuid: null
    tunnel_name: null
    hostname: null
    credential_source: null

services:
  webui:
    host: 127.0.0.1
    port: 8780
  orchestrator:
    host: 127.0.0.1
    port: 8765
  concept_forge:
    provider: ollama
    base_url: http://127.0.0.1:11434
    model: everspark-concept
    prompt_mode: no_think
  image_forge:
    adapter: comfyui
    base_url: http://127.0.0.1:8188

memory:
  database: ./Data/Memory/everspark.db
  working:
    enabled: true
    max_history_messages: 20
  episodic:
    enabled: false
  state:
    enabled: true
    schema: ./ConceptForge/Schemas/character_subject.v1.schema.json

workflow:
  directory: ./ImageForge/Workflows
  default_workflow: base-illustrious
  template: ./ImageForge/Workflows/base_workflow_api.json
  positive_prompt_node: "34"
  negative_prompt_node: "7"
  seed_node: "31"
  managed_default_checkpoint: Illustrious-XL-v1.0.safetensors
